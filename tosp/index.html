<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TOSP — Team Onboarding &amp; Skill Progression Platform (Prototype)</title>
  <script>
    // Sets the theme before first paint so there is no flash of the wrong
    // theme while the module scripts load. Mirrors theme-service.js's
    // resolution order (saved preference -> OS preference -> light).
    (function () {
      try {
        var saved = window.localStorage.getItem('tosp.ui.theme.v1');
        var theme = saved === 'light' || saved === 'dark'
          ? saved
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (err) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <a href="#app-main" class="skip-link">Skip to main content</a>

  <div id="app" class="app-shell">
    <div id="app-shell-nav"></div>
    <main id="app-main" class="app-main" tabindex="-1" aria-live="polite"></main>
    <footer class="app-footer">
      <p>
        TOSP · Team Onboarding &amp; Skill Progression Platform ·
        <strong>PROTOTYPE_ONLY</strong> — This is a frontend-only prototype.
        Progress is stored in this browser and is not official onboarding evidence.
      </p>
    </footer>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
